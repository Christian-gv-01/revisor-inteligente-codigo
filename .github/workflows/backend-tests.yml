name: CODEGUARD backend tests

on:
  push:
    branches:
      - main
      - feature/semana4-endurecimiento-http
      - feature/entrega-4-qa-seguridad-documentacion
  pull_request:
    paths:
      - "backend/**"
      - "eval/**"
      - "scripts/**"
      - "qa/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    env:
      ANONYMIZED_TELEMETRY: "False"
      OTEL_SDK_DISABLED: "true"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar JavaScript y controles de Agent Lab
        run: node qa/check_agent_lab_ui.cjs
      - name: Install backend requirements and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Validar diseño A/B sin consumo de Gemini
        run: |
          python -W error::SyntaxWarning -m py_compile eval/evaluar_planificador_agente.py
          python eval/evaluar_planificador_agente.py
      - name: Validate syntax
        run: |
          python -m compileall -q backend/app
          sh -n docker/entrypoint.sh
      - name: Backend tests
        working-directory: backend
        env:
          RATE_LIMIT_ENABLED: "0"
          CONCURRENCY_LIMIT_ENABLED: "0"
          TRUST_RAILWAY_REAL_IP: "0"
        run: python -m pytest -q --junitxml=../qa-backend.xml
      - name: QA runner tests
        run: python -m pytest qa -q --junitxml=qa-runners.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: qa-*.xml

