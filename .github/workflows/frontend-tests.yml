name: CODEGUARD frontend

on:
  push:
    branches:
      - feature/semana4-frontend-contrato-estatico
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validar ESLint
        working-directory: frontend
        run: npm run lint
      - name: Compilar TypeScript y React
        working-directory: frontend
        run: npm run build
      - name: Pruebas de frontend
        working-directory: frontend
        run: npm run test
