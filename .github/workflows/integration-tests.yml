name: CODEGUARD integracion HTTP

on:
  push:
    branches: [main, feature/entrega4-qa-pr19]
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "eval/**"
      - ".github/workflows/integration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: python -m pip install -r backend/requirements.txt
      - name: Preparar ChromaDB local
        run: python scripts/ingest.py
      - name: Integracion con Ruff y Bandit reales
        run: python eval/run_integration.py --static-analysis --output tmp/http-estatico
      - name: Compatibilidad sin analisis estatico
        run: python eval/run_integration.py --output tmp/http-sin-estatico
      - name: Instalar navegador de QA aislado
        run: |
          npm install --prefix "$RUNNER_TEMP/codeguard-browser" --no-save --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/codeguard-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Interfaz contra backend real de correcciones (Gemini simulado)
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/codeguard-browser/node_modules/playwright/index.mjs
        run: |
          node frontend/tests/correction-browser.mjs tmp/http-demo
          python eval/run_integration.py --static-analysis --correction-browser --output tmp/http-navegador
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integracion-http
          path: |
            tmp/http-*/*.json
            tmp/http-*/*.txt
            tmp/http-*/*.png

